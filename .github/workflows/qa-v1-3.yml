name: QA V1.3 (rama de desarrollo)
on:
  push:
    branches:
      - desarrollo-v1-3-lanzamiento
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regresión de motor, 243 escenas y finales
        run: node tests/qa-regresion.mjs
      - name: Verificar que hay 16 fragmentos y cargador aislado
        shell: bash
        run: |
          test -f index.html
          for n in $(seq -w 0 15); do true; done
          node --input-type=module -e "import{existsSync}from'node:fs';for(let i=0;i<16;i++){let p='parts/'+String(i).padStart(3,'0')+'.txt';if(!existsSync(p))throw Error('Falta '+p)}console.log('PASS: 16 fragmentos presentes')"
