name: QA V1.3 (rama de desarrollo)
on:
  push:
    branches:
      - desarrollo-v1-3-lanzamiento
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor-y-navegadores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regresión del motor (256 escenas, finales, guardados)
        run: node tests/qa-regresion.mjs
      - name: Verificar los 16 fragmentos del cargador
        shell: bash
        run: |
          node --input-type=module -e "import{existsSync}from'node:fs';for(let i=0;i<16;i++){let p='parts/'+String(i).padStart(3,'0')+'.txt';if(!existsSync(p))throw Error('Falta '+p)}console.log('PASS: 16 fragmentos presentes')"
      - name: Instalar navegadores de prueba (sin dependencias del juego)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Portada, decisiones, guardado y Game Over en navegadores emulados
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/casas-qa-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep 1; done
          node tests/qa-navegador.mjs
      - name: Partida íntegra en navegador móvil emulado
        run: node tests/qa-partida-navegador.mjs
      - name: Obtener propuesta GitHub Pages sin publicar
        uses: actions/checkout@v4
        with:
          ref: preparar-beta-v1-3-github-pages
          path: staging-pages
          persist-credentials: false
      - name: Verificar V1.2 y V1.3 desde el mismo GitHub Pages
        shell: bash
        run: |
          python3 -m http.server 4174 --directory staging-pages --bind 127.0.0.1 > /tmp/pages-staging.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/index.html >/dev/null && break || sleep 1; done
          node tests/qa-pages-staging.mjs
      - name: Obtener nueva beta GitHub Pages V1.4 sin publicar
        uses: actions/checkout@v4
        with:
          ref: preparar-beta-v1-4-github-pages
          path: staging-pages-v14
          persist-credentials: false
      - name: Comprobar las tres betas en un único origen y la nueva Vigilia
        shell: bash
        run: |
          python3 -m http.server 4175 --directory staging-pages-v14 --bind 127.0.0.1 > /tmp/pages-v14.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/beta-v1-4/index.html >/dev/null && break || sleep 1; done
          node tests/qa-v14-staging.mjs
      - name: Capturas para revisión posterior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-qa-v1-3
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 3
