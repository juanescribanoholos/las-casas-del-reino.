name: Vista temporal V1.3 en Netlify (sin credenciales)
on:
  push:
    branches:
      - desarrollo-v1-3-lanzamiento
    paths:
      - .github/workflows/publicar-beta-v1-3-temporal.yml
permissions:
  contents: read
jobs:
  crear-beta-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar solamente los archivos jugables de la V1.3
        shell: bash
        run: |
          mkdir -p beta-tmp/parts
          cp index.html beta-tmp/index.html
          cp parts/*.txt beta-tmp/parts/
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > beta-tmp/_headers
          for n in $(seq 0 15); do test -s "beta-tmp/parts/$(printf '%03d' "$n").txt"; done
          echo "16 fragmentos presentes, main intacto, sin secretos ni cobros."
      - name: Publicar sitio anónimo temporal en Netlify
        shell: bash
        run: |
          set -eu
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=beta-tmp --no-build --json > /tmp/beta_netlify_result.json
          python3 - <<'PY'
          import json,re
          raw=open('/tmp/beta_netlify_result.json',encoding='utf-8').read()
          try:
              data=json.loads(raw)
          except Exception:
              pos=raw.find('{')
              if pos<0:raise ValueError('Netlify CLI no devolvió JSON; no se exponen respuestas ni tokens')
              data=json.loads(raw[pos:])
          from urllib.parse import urlparse
          rawurl=str(data.get('site_url') or data.get('deploy_url') or data.get('url') or '')
          if not rawurl:raise ValueError('Netlify no ha indicado site_url')
          url=rawurl if rawurl.startswith('http') else 'https://'+rawurl.lstrip('/')
          if url.startswith('http://'):url='https://'+url[7:]
          host=urlparse(url).hostname or ''
          if not url.startswith('https://') or not (host=='netlify.app' or host.endswith('.netlify.app')):
              print('DIAGNOSTICO: protocolo y host devueltos:',urlparse(url).scheme,host)
              raise ValueError('La URL de Netlify no es una URL pública HTTPS reconocible')
          print('ENLACE_BETA_V13='+url)
          password=str(data.get('password') or '')
          if password:
              print('CONTRASENA_BETA_TEMPORAL='+password)
              with open('/tmp/beta_password.txt','w') as f:f.write(password)
          with open('/tmp/beta_url.txt','w') as f:f.write(url)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Beta V1.3 temporal\n\n'+url+'\n\nPrueba temporal independiente. Netlify elimina los sitios anónimos no reclamados transcurrida una hora.\n')
          PY
      - name: Verificar que la beta sirve portada y fragmentos reales
        shell: bash
        run: |
          set -eu
          url="$(cat /tmp/beta_url.txt)"
          http_code=$(curl -sSL --max-time 35 -o /tmp/beta_index.html -w '%{http_code}' "$url")
          echo "PORTADA_HTTP=$http_code"
          if [ "$http_code" = 200 ]; then
            grep -q 'Los caminos del Reino' /tmp/beta_index.html
            curl -fsSL "${url%/}/parts/003.txt" -o /tmp/beta_part3.txt
            grep -q "const SAVE_KEY=" /tmp/beta_part3.txt
            curl -fsSL "${url%/}/parts/015.txt" -o /tmp/beta_part15.txt
            test "$(wc -c < /tmp/beta_part15.txt)" -gt 300000
            echo "PASS: HTTPS, portada, motor y último fragmento accesibles."
          elif [ "$http_code" = 401 ] || [ "$http_code" = 403 ]; then
            echo 'AVISO: Netlify protege temporalmente el sitio con contraseña; requiere validación autenticada.'
          else
            echo "ERROR: respuesta inesperada de Netlify ($http_code)"
            exit 1
          fi
